[build]
  publish = "dist"
  command = "npm run build"

# Proxy API calls to Railway so the browser can use same-origin /api/*
[[redirects]]
  from = "/api/*"
  to = "https://co-golf.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
